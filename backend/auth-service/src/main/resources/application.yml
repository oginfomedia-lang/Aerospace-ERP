server:
  port: 8087

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: ${DB_PASSWORD:postgres@123}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      # Flyway now owns schema changes (see db/migration/) — Hibernate just
      # verifies the schema matches the entities at boot and refuses to start
      # if they've drifted, instead of silently auto-altering the schema.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # This service's schema already exists (built up via ddl-auto: update over
    # the course of development) — baseline-on-migrate tells Flyway "if the
    # target database already has tables, treat V1 as already applied rather
    # than trying to re-run CREATE TABLE against existing tables." A genuinely
    # fresh/empty database (e.g. a new environment) still gets V1 run for real.
    baseline-on-migrate: true
    baseline-version: 1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# JWT Custom Properties
app:
  jwt:
    # 256-bit base64 secret key
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  bootstrap-admin:
    username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    email: ${ADMIN_BOOTSTRAP_EMAIL:admin@example.com}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

app.frontend.supplier-portal-base-url: http://localhost:3000
app.frontend.base-url: http://localhost:3000

# Cross-service HTTP client — used to verify a supplier's confirmation status
# with procurement-service before inviting them to the Supplier Portal.
services:
  procurement:
    base-url: http://localhost:8086/api

# Retry + circuit breaker around ProcurementServiceClient.getSupplier — a GET, safe
# to retry. See the @Retry/@CircuitBreaker annotations there.
resilience4j:
  retry:
    instances:
      procurementService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      procurementService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3

