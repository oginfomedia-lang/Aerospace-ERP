server:
  port: 8087

spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres@123

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# JWT Custom Properties
app:
  jwt:
    # 256-bit base64 secret key
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  bootstrap-admin:
    username: ${ADMIN_BOOTSTRAP_USERNAME:admin}
    email: ${ADMIN_BOOTSTRAP_EMAIL:admin@example.com}
    password: ${ADMIN_BOOTSTRAP_PASSWORD:}

app.frontend.supplier-portal-base-url: http://localhost:3000

# Cross-service HTTP client — used to verify a supplier's confirmation status
# with procurement-service before inviting them to the Supplier Portal.
services:
  procurement:
    base-url: http://localhost:8086/api

