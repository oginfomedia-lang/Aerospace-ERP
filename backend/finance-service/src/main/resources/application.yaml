server:
  port: 8092

spring:
  application:
    name: finance-service

  datasource:
    url: jdbc:postgresql://localhost:5432/finance_db
    username: postgres
    password: ${DB_PASSWORD:postgres@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      # Flyway now owns schema changes (see db/migration/) — Hibernate just
      # verifies the schema matches the entities at boot and refuses to start
      # if they've drifted, instead of silently auto-altering the schema.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    # This service's schema already exists (built up via ddl-auto: update over
    # the course of development) — baseline-on-migrate tells Flyway "if the
    # target database already has tables, treat V1 as already applied rather
    # than trying to re-run CREATE TABLE against existing tables." A genuinely
    # fresh/empty database (e.g. a new environment) still gets V1 run for real.
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
    consumer:
      group-id: finance-service
      auto-offset-reset: earliest
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    com.aerospace.finance_service: DEBUG
    org.springframework.kafka: WARN

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Journals at/above this amount require ApprovalEngine sign-off before posting;
# below it, submit() auto-posts immediately. 0 = every journal needs approval.
finance:
  journal:
    approval-threshold: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
