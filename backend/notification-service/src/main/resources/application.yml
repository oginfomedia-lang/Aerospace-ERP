server:
  port: 8083

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
    username: postgres
    password: ${DB_PASSWORD:postgres@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:shraddhasadavarte24@gmail.com}
    password: ${MAIL_PASSWORD:CHANGEME-this-app-password-was-committed-to-git-and-must-be-revoked-in-your-Google-account-then-set-via-the-MAIL_PASSWORD-env-var}
    properties:
      mail:
        smtp:
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          auth: true
          starttls:
            enable: true

notification:
  email:
    enabled: true                            # set true once Gmail app password is configured
    from: noreply@aerospace.local
    recipients: oginfomedia@gmail.com
  low-stock-threshold: 10

  kafka:
    topics:
      # ── Inventory topics ──────────────────────────────────────────────────
      stock-low:         stock-low-events
      qa-status-changed: qa-status-changed-events
      material-issued:   material-issued-events
      stock-received:    stock-received-events
      part-created:      part-created-events
      vendor-return:     vendor-return-events
      # ── Work order topics ─────────────────────────────────────────────────
      work-order-created:   work-order-created-events
      work-order-updated:   work-order-updated-events
      work-order-completed: work-order-completed-events
      # ── QA topics ─────────────────────────────────────────────────────────
      calibration-due:      qa.calibration.due

      approval-escalated:   approval-escalated-events
      maintenance-due: production-resource.maintenance.due
      password-reset-requested: password-reset-requested-events
      sales-order-dispatched: sales-order-dispatched-events

logging:
  level:
    com.aerospace.notification_service: DEBUG
    org.apache.kafka: WARN

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30