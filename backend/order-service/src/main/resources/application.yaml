server:
  port: 8084

spring:
  application:
    name: work-order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/workorder_db
    username: postgres
    password: ${DB_PASSWORD:postgres@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      # Flyway now owns schema changes (see db/migration/) — Hibernate just
      # verifies the schema matches the entities at boot and refuses to start
      # if they've drifted, instead of silently auto-altering the schema.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    # This service's schema already exists (built up via ddl-auto: update over
    # the course of development) — baseline-on-migrate tells Flyway "if the
    # target database already has tables, treat V1 as already applied rather
    # than trying to re-run CREATE TABLE against existing tables." A genuinely
    # fresh/empty database (e.g. a new environment) still gets V1 run for real.
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
    consumer:
      group-id: workorder-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# Kafka topic names — consumed and produced by this service
workorder:
  kafka:
    topics:
      work-order-created: work-order-created-events
      work-order-updated: work-order-updated-events
      work-order-completed: work-order-completed-events
      material-request: material-request-events
      qa-status-changed: qa-status-changed-events    # consumed from inventory-service
      material-issued: material-issued-events        # consumed from inventory-service

# Cross-service HTTP clients (used by RestTemplate for inventory stock checks)
services:
  inventory:
    base-url: http://localhost:8081/api/v1

logging:
  level:
    com.aerospace.workorder_service: DEBUG
    org.apache.kafka: WARN
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Circuit breaker (no retry) around WorkOrderServiceImpl.issueMaterial's call into
# inventory-service's /issue-to-production — that call performs a real stock
# deduction with no idempotency key, so it must never be blindly retried on a
# timeout (a lost response could double-deduct). The circuit breaker alone still
# lets repeated failures fail fast without resending anything.
resilience4j:
  circuitbreaker:
    instances:
      inventoryService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3