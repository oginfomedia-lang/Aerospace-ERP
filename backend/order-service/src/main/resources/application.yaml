server:
  port: 8084

spring:
  application:
    name: work-order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/workorder_db
    username: postgres
    password: postgres@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: workorder-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

# Kafka topic names — consumed and produced by this service
workorder:
  kafka:
    topics:
      work-order-created: work-order-created-events
      work-order-updated: work-order-updated-events
      work-order-completed: work-order-completed-events
      material-request: material-request-events
      qa-status-changed: qa-status-changed-events    # consumed from inventory-service
      material-issued: material-issued-events        # consumed from inventory-service

# Cross-service HTTP clients (used by RestTemplate for inventory stock checks)
services:
  inventory:
    base-url: http://localhost:8081/api/v1

logging:
  level:
    com.aerospace.workorder_service: DEBUG
    org.apache.kafka: WARN
    org.hibernate.SQL: WARN

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30