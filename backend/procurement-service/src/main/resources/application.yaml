server:
  port: 8086

spring:
  application:
    name: procurement-service
  config:
    import: optional:configserver:http://localhost:8888

  datasource:
    url: jdbc:postgresql://localhost:5432/procurement_db
    username: postgres
    password: ${DB_PASSWORD:postgres@123}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      # Flyway now owns schema changes (see db/migration/) — Hibernate just
      # verifies the schema matches the entities at boot and refuses to start
      # if they've drifted, instead of silently auto-altering the schema.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

procurement:
  po:
    # PUR-BR-002-ORIGIN: set to false to allow POs with no PR/RFQ link (an explicit,
    # configured exception rather than an accidental gap)
    require-pr-origin: true

