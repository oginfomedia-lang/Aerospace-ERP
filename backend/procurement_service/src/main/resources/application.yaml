server:
  port: 8085

spring:
  application:
    name: procurement-service

  datasource:
    url: jdbc:postgresql://localhost:5432/procurement_db
    username: postgres
    password: postgres@123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: procurement-group
      auto-offset-reset: latest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

procurement:
  kafka:
    topics:
      # consumed — from inventory-service
      stock-low: stock-low-events
      # published — to inventory and notification services
      po-created:   po-created-events
      po-approved:  po-approved-events
      po-received:  po-received-events
      po-cancelled: po-cancelled-events

# URL of inventory-service — used to trigger GRN when PO is received
services:
  inventory:
    base-url: http://localhost:8081/api/v1

logging:
  level:
    com.aerospace.procurement_service: DEBUG
    org.apache.kafka: WARN
    org.hibernate.SQL: WARN