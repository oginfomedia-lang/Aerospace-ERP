spring:
  application:
    name: production-service

  datasource:
    url: jdbc:postgresql://localhost:5432/production_db
    username: postgres
    password: ${DB_PASSWORD:postgres@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      # Flyway now owns schema changes (see db/migration/) — Hibernate just
      # verifies the schema matches the entities at boot and refuses to start
      # if they've drifted, instead of silently auto-altering the schema.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";
    consumer:
      group-id: production-group
      auto-offset-reset: latest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8085

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.aerospace.production_service: DEBUG
    org.springframework.kafka: WARN
    org.hibernate.SQL: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

services:
  production-resource:
    base-url: http://localhost:8090/api/v1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Retry + circuit breaker around ProductionResourceClient's calls into
# production-resource-service — GET (read) calls carry @Retry; the occupy* POSTs are
# not idempotent (they hard-check current occupancy state) so they get the circuit
# breaker alone. See the @Retry/@CircuitBreaker annotations on the client.
resilience4j:
  retry:
    instances:
      productionResourceService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      productionResourceService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3