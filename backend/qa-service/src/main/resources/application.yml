server:
  port: 8082   # inventory is 8081, QA is 8082

spring:
  application:
    name: qa-service

  datasource:
    url: jdbc:postgresql://localhost:5432/qa_db   # separate DB from inventory
    username: postgres
    password: ${DB_PASSWORD:postgres@123}
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      # Flyway now owns schema changes (see db/migration/) — Hibernate just
      # verifies the schema matches the entities at boot and refuses to start
      # if they've drifted, instead of silently auto-altering the schema.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # This service's schema already exists (built up via ddl-auto: update over
    # the course of development) — baseline-on-migrate tells Flyway "if the
    # target database already has tables, treat V1 as already applied rather
    # than trying to re-run CREATE TABLE against existing tables." A genuinely
    # fresh/empty database (e.g. a new environment) still gets V1 run for real.
    baseline-on-migrate: true
    baseline-version: 1

  kafka:
    bootstrap-servers: localhost:9092
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: PLAIN
      sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_USERNAME:}" password="${KAFKA_PASSWORD:}";

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.info.headers: false

    consumer:
      group-id: qa-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.use.type.headers: false
        spring.json.type.mapping: "stockReceived:com.aerospace.qa_service.event.StockReceivedEvent"
        spring.json.value.default.type: com.aerospace.qa_service.event.StockReceivedEvent

# Logging
logging:
  level:
    com.aerospace.qa_service: DEBUG
    org.apache.kafka: WARN   # suppress verbose Kafka internal logs

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

qa:
  calibration:
    alert-window-days: 30

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30