server:
  port: 8088

spring:
  application:
    name: reporting-service
  datasource:
    url: jdbc:postgresql://localhost:5432/reporting_db
    username: postgres
    password: ${DB_PASSWORD:postgres@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: reporting-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: >
          StockReceivedEvent:com.aerospace.reporting_service.event.StockReceivedEvent,
          PartCreatedEvent:com.aerospace.reporting_service.event.PartCreatedEvent,
          MaterialIssuedEvent:com.aerospace.reporting_service.event.MaterialIssuedEvent,
          StockLowEvent:com.aerospace.reporting_service.event.StockLowEvent,
          QAStatusChangedEvent:com.aerospace.reporting_service.event.QAStatusChangedEvent,
          WorkOrderCreatedEvent:com.aerospace.reporting_service.event.WorkOrderCreatedEvent,
          WorkOrderStatusChangedEvent:com.aerospace.reporting_service.event.WorkOrderStatusChangedEvent,
          WorkOrderCompletedEvent:com.aerospace.reporting_service.event.WorkOrderCompletedEvent,
          ProductionOrderCreatedEvent:com.aerospace.reporting_service.event.ProductionOrderCreatedEvent,
          ProductionOrderCompletedEvent:com.aerospace.reporting_service.event.ProductionOrderCompletedEvent,
          PurchaseOrderCreatedEvent:com.aerospace.reporting_service.event.PurchaseOrderCreatedEvent

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

logging:
  level:
    com.aerospace: DEBUG
    org.springframework.kafka: INFO

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

services:
  sales:
    base-url: http://localhost:8091/api/v1

# Retry + circuit breaker around SalesResourceClient.getSummary — a GET, safe to
# retry. See the @Retry/@CircuitBreaker annotations there.
resilience4j:
  retry:
    instances:
      salesService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      salesService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3