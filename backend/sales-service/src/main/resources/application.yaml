server:
  port: 8091

spring:
  application:
    name: sales-service

  datasource:
    url: jdbc:postgresql://localhost:5432/sales_db
    username: postgres
    password: ${DB_PASSWORD:postgres@123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: sales-group
      auto-offset-reset: latest
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

logging:
  level:
    com.aerospace.sales_service: DEBUG
    org.springframework.kafka: WARN

app:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Base URLs for every OTHER service this one calls directly over HTTP (not Kafka) —
# see the SalesResourceClients in Phase 4/5/8 below.
services:
  inventory:
    base-url: http://localhost:8081/api/v1
  production:
    base-url: http://localhost:8085/api/v1
  qa:
    base-url: http://localhost:8082/api/v1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30

# Retry + circuit breaker around the direct HTTP calls in SalesResourceClient — see
# the @Retry/@CircuitBreaker annotations there. Only GET (read) calls carry @Retry;
# POSTs with real side effects (reserve/release/consume/return/qa-decision) get the
# circuit breaker alone since inventory-service has no dedup guard on them.
resilience4j:
  retry:
    instances:
      inventoryService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
      productionService:
        max-attempts: 3
        wait-duration: 500ms
        retry-exceptions:
          - org.springframework.web.client.ResourceAccessException
  circuitbreaker:
    instances:
      inventoryService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3
      productionService:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
        permitted-number-of-calls-in-half-open-state: 3