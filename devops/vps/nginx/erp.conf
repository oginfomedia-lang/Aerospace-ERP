# Aerospace-ERP — Nginx server block.
#
# Install: copy this to /etc/nginx/sites-available/ilitecode.com, then:
#   sudo ln -s /etc/nginx/sites-available/ilitecode.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d ilitecode.com     # issues the cert AND rewrites
#                                                    # this file to add the SSL
#                                                    # server block automatically —
#                                                    # run this AFTER the above,
#                                                    # don't hand-write SSL lines
#                                                    # here yourself.
#
# Domain already set below: ilitecode.com.
#
# Design: only this Nginx block and api-gateway (127.0.0.1:8089) are involved in
# a browser request — every other backend service stays bound to localhost and is
# never reached directly from the internet. The frontend build's REACT_APP_*_API_URL
# values all point at this same domain (see devops/vps/README.md) so browser calls
# are same-origin — no CORS preflight even needed for the common case, though
# CORS_ALLOWED_ORIGINS is still set correctly server-side as defense in depth.

server {
    listen 80;
    server_name ilitecode.com;

    # React build output — static files only, no Node process needed to serve them.
    root /opt/aerospace-erp/frontend/web-app/build;
    index index.html;

    # Client-side routed SPA — any path Nginx can't find as a real file falls
    # through to index.html so react-router handles it, not a raw Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Every backend API call goes through api-gateway — matches the Path=
    # predicates already defined in api-gateway's own application.yaml
    # (StripPrefix: 0, so the full path is forwarded unchanged).
    location ~ ^/(api|ws)/ {
        proxy_pass http://127.0.0.1:8089;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for the /ws/** route (notification-service's websocket) —
        # everything else ignores these headers harmlessly.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # api-gateway's own JWT validation, rate limiting, and security headers
        # already run on every request here — nothing extra needed at this layer.
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # Keep request bodies to a sane cap — the largest legitimate payload here is
    # probably a bulk part-import spreadsheet, not multi-hundred-MB uploads.
    client_max_body_size 20m;
}
